services:
  local-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-proxy
    restart: always
    ports:
      - "${PORT:-18765}:${PORT:-18765}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-18765}
      - PYTHONUNBUFFERED=1
      - RUNNING_IN_DOCKER=1
    extra_hosts:
      - "${HOST_GATEWAY_HOSTNAME:-host.docker.internal}:${HOST_GATEWAY_ADDRESS:-host-gateway}"
    volumes:
      - ./var/logs:/app/var/logs
      - ./var/cache:/app/var/cache
      - ./var/run:/app/var/run
      - ./config:/app/config
    networks:
      - proxy-net
      - shared-panel-network

networks:
  proxy-net:
    driver: bridge
  shared-panel-network:
    name: ${SHARED_DOCKER_NETWORK:-1panel-network}
    external: true
